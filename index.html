    <!--
      Set the theme before first paint so there is never a flash of the wrong
      one. Light is the default; dark is opt-in via the header toggle.
      Mirrors resolveTheme() in src/lib/useTheme.ts - change both together.
    -->
    <script>
      (function () {
        var dark = false
        try {
          dark = localStorage.getItem('theme') === 'dark'
        } catch (e) {
          /* storage blocked - keep the default */
        }
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
